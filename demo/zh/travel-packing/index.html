        <h1>旅行行李清单</h1>
        <p class="lead">出发前一晚核对一遍，到机场就不慌。</p>
<h2>都带了吗？</h2>
<ul><li>护照、身份证，机票和酒店预订页面截图</li><li>手机充电器、充电宝（随身携带）、转换插头</li><li>常备药：胃药、止痛药、创可贴</li><li>洗漱用品装小瓶（随身携带不超过100ml）</li><li>一天的换洗衣物放进随身包</li><li>当地能用的银行卡和少量现金</li><li>折叠购物袋或密封袋（装纪念品、湿衣服）</li></ul>
<p class="notice">行李收好后先拎一下，太重就先拿掉一件衣服。</p>
